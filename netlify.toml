# Configuración de Netlify para sjaquer.is-a.dev
# Next.js: Netlify detecta el framework y usa su runtime de Next (@netlify/plugin-nextjs).
# Última actualización: 2026-10-11

[build]
  command = "pnpm build"
  publish = ".next"

# Redirección 301 de www a non-www (canonical)
[[redirects]]
  from = "https://www.sjaquer.is-a.dev/*"
  to = "https://sjaquer.is-a.dev/:splat"
  status = 301
  force = true

# Seguridad (el HTML ya no lleva caché inmutable: Next gestiona la caché de cada ruta)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Language = "es-PE"

# Assets con hash de Next
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
