<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- CSS crítico inline para evitar bloqueo de renderizado -->
    <style>
      /* Critical CSS para first paint */
      html, body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      body { background: #0a0f17; color: #ffffff; line-height: 1.6; }
      #root { min-height: 100vh; }
      .site-bg { position: fixed; inset: 0; z-index: -10; background: linear-gradient(125deg, #0a0f17 0%, #0c1622 45%, #081018 100%); }
      .loading-fallback { display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #ffffff; }
    </style>
    
    <!-- Preload recursos críticos para mejor performance -->
    <link rel="preload" href="/images/iconperso.webp" as="image" type="image/webp" />
    <link rel="preload" href="/images/iconweb.webp" as="image" type="image/webp" />
    
    <!-- Preconnect para recursos críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preconnect" href="https://files.catbox.moe" />
    
    <!-- DNS prefetch para recursos externos -->
    <link rel="dns-prefetch" href="//wa.me" />
    <link rel="dns-prefetch" href="//github.com" />
    <link rel="dns-prefetch" href="//linkedin.com" />
    <link rel="dns-prefetch" href="//static.cloudflareinsights.com" />
    
    <!-- Título optimizado: más conciso y potente -->
    <title>Sebastián Jaque | Desarrollador, Estratega & Artista 3D</title>
    
    <!-- Meta Descripción mejorada: más accionable y con keywords -->
    <meta name="description" content="Explora el portafolio de Sebastián Jaque, desarrollador de soluciones y estratega creativo en Lima, Perú. Experto en automatización, SEO y entornos 3D con Unreal Engine." />
    
    <meta name="author" content="Sebastián Jaque" />
    <link rel="canonical" href="https://sjaquer.is-a.dev/" />

    <!-- Open Graph (OG) -->
    <meta property="og:title" content="Sebastián Jaque | Portafolio Profesional" />
    <meta property="og:description" content="Desarrollador de soluciones, estratega de contenido y artista 3D. Explora mis proyectos en tecnología, SEO y creatividad." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sjaquer.is-a.dev/" />
    <meta property="og:image" content="https://sjaquer.is-a.dev/og-image.png" /> 
    <meta property="og:locale" content="es_PE" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sebastián Jaque | Portafolio Profesional" />
    <meta name="twitter:description" content="Desarrollador de soluciones, estratega de contenido y artista 3D. Explora mis proyectos en tecnología, SEO y creatividad." />
    <meta name="twitter:image" content="https://sjaquer.is-a.dev/og-image.png" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GDPBN9G1M5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GDPBN9G1M5', { 'anonymize_ip': true });
    </script>

    <!-- Schema.org (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Sebastián Jaque",
      "url": "https://sjaquer.is-a.dev/",
      "image": "https://sjaquer.is-a.dev/og-image.png",
      "sameAs": [
        "https://github.com/sjaquer"
      ],
      "jobTitle": "Desarrollador de Soluciones y Estratega Creativo",
      "worksFor": {
        "@type": "Organization",
        "name": "NHL Publicidad"
      },
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Universidad Norbert Wiener"
      },
      "knowsAbout": ["Desarrollo Web", "SEO", "Estrategia de Contenido", "Unreal Engine", "Visualización 3D", "Automatización de Procesos", "Power BI"],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lima",
        "addressCountry": "PE"
      }
    }
    </script>

    <!-- Carga diferida de fonts para mejor performance -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" onload="this.rel='stylesheet'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root">
      <!-- Fallback de carga para mejor UX -->
      <div class="loading-fallback">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
          <div style="width: 3rem; height: 3rem; border: 4px solid #374151; border-top: 4px solid #3B82F6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
          <p style="color: #9CA3AF; font-size: 0.875rem;">Cargando portafolio...</p>
        </div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
